version: '3'

services:
  # Build the backend from this checkout; expose it only to the gateway
  backend:
    build: .
    image: agent-creation:local
    container_name: sap-backend
    restart: unless-stopped
    volumes:
      - ./super-agent-data:/app/data
    # No host port mapping; access the backend through the gateway

  # Inherited upstream authentication gateway (Docker Hub)
  gateway:
    image: ailm32442/nginx-for-sap:latest
    container_name: sap-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3456:3456"  # Bind the gateway to loopback by default
    environment:
      - JWT_SECRET=ChangeThisToARandomString123!
      - INIT_USER=root
      - INIT_PASS=pass
      # To reset forgotten credentials to the initial values, set true and restart; then restore false.
      - FORCE_RESET=false 
    volumes:
      - ./gateway-data:/data # Persist the authentication data
    depends_on:
      - backend