name: Agent Creation — source audit

on:
  push:
    branches:
      - agent-creation
  pull_request:
    branches:
      - agent-creation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-audit:
    name: Smoke check and English-surface inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing SAP JavaScript and JSON smoke check
        run: npm test
      - name: Check reversible companion navigation wiring
        run: node scripts/companion-ui-smoke.js
      - name: Companion prompt compatibility tests
        run: python -m unittest discover -s tests -p 'test_companion_defaults.py' -v
      - name: English avatar motion instruction tests
        run: python -m unittest discover -s tests -p 'test_english_avatar_instructions.py' -v
      - name: English environment and relationship prompt tests
        run: python -m unittest discover -s tests -p 'test_english_runtime_prompt_sections.py' -v
      - name: English widget and speech prompt tests
        run: python -m unittest discover -s tests -p 'test_english_model_prompt_blocks.py' -v
      - name: Model instruction English tests
        run: python -m unittest discover -s tests -p 'test_english_agent_instructions.py' -v
      - name: English visible UI and license tests
        run: python -m unittest discover -s tests -p 'test_legal_and_visible_english.py' -v
      - name: English HTML fallback tests
        run: python -m unittest discover -s tests -p 'test_english_html_fallbacks.py' -v
      - name: Model download source policy tests
        run: python -m unittest discover -s tests -p 'test_model_source_policy.py' -v
      - name: Regional messaging frontend isolation tests
        run: python -m unittest discover -s tests -p 'test_region_bot_frontend_contract.py' -v
      - name: Livestream platform isolation tests
        run: python -m unittest discover -s tests -p 'test_live_platform_isolation.py' -v
      - name: Regional messaging exclusion tests
        run: python -m unittest discover -s tests -p 'test_legacy_bot_removal.py' -v
      - name: English-only runtime contract
        run: python -m unittest discover -s tests -p 'test_english_runtime_contract.py' -v
      - name: Check Python syntax in edited modules
        run: python -m py_compile py/companion_defaults.py py/live_router.py py/sherpa_model_manager.py py/ebd_model_manager.py py/moss_model_manager.py server.py py/sub_agent.py py/diary_chat_integration.py py/autoBehavior.py
      - name: Audit source text (inventory only; no automatic edits)
        run: python scripts/audit_english_surface.py --root . --json english-surface-report.json --limit 25
      - name: Upload text inventory for review
        uses: actions/upload-artifact@v4
        with:
          name: english-surface-audit
          path: english-surface-report.json
          retention-days: 14
