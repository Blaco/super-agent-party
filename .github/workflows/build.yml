name: Windows x64 development package

on:
  workflow_dispatch:
  push:
    branches:
      - agent-creation
    paths:
      - .github/workflows/build.yml
      - .gitignore
      - scripts/audit_english_surface.py
      - tests/test_english_surface_inventory.py
      - scripts/windows_packaged_smoke.py

permissions:
  contents: read

concurrency:
  group: windows-development-package
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows x64 (no release)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify English source and retired artwork
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -p 'test_english_surface_inventory.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'English inventory regression tests failed.' }
          python scripts/audit_english_surface.py --root . --tracked-only --fail-on-first-party-han
          if ($LASTEXITCODE -ne 0) { throw 'First-party English source gate failed.' }

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Verify and install locked Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv lock --check --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency lock is stale.' }
          python scripts/check_python_lock.py
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency source policy failed.' }
          uv sync --locked --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'Locked Python dependency installation failed.' }
          uv run --locked python --version

      - name: Install Electron dependencies
        shell: pwsh
        env:
          ELECTRON_CUSTOM_DIR: ''
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
        run: |
          $ErrorActionPreference = 'Stop'
          $success = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Electron install attempt $attempt of 3"
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            Write-Warning "Electron download/install failed (exit $LASTEXITCODE)."
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          if (-not $success) {
            throw 'Electron npm dependency installation failed after three attempts.'
          }

      - name: Run JavaScript smoke checks
        shell: pwsh
        run: npm test

      - name: Validate current Python and Electron sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --locked python -m py_compile server.py py/live_router.py py/web_search.py py/sub_agent.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Python syntax validation failed.'
          }
          node --check main.js
          if ($LASTEXITCODE -ne 0) {
            throw 'Electron main-process syntax validation failed.'
          }
          uv run --locked python -m unittest discover -s tests -p 'test_english_search_tools.py' -v
          if ($LASTEXITCODE -ne 0) {
            throw 'English search model-tool schema test failed.'
          }

      - name: Package Python server
        shell: pwsh
        run: |
          uv run --locked pyinstaller --noconfirm --clean server.spec
          if (-not (Test-Path 'dist/server/server.exe')) {
            throw 'PyInstaller did not create dist/server/server.exe'
          }

      - name: Package Electron directory
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win --x64 --dir --publish never
          if (-not (Test-Path 'release/win-unpacked')) {
            throw 'electron-builder did not produce win-unpacked'
          }

      - name: Exercise bundled backend with a disposable profile
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --locked python scripts/windows_packaged_smoke.py --server release/win-unpacked/resources/server/server.exe --log-dir "$env:RUNNER_TEMP/agent-backend-smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged backend runtime smoke test failed.' }
          Copy-Item "$env:RUNNER_TEMP/agent-backend-smoke/BACKEND-SMOKE.json" "release/win-unpacked/BACKEND-SMOKE.json"

      - name: Upload synthetic backend smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agent-backend-smoke/*.log
            ${{ runner.temp }}/agent-backend-smoke/BACKEND-SMOKE.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Create manifest, ZIP and checksum
        id: archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0, 12)
          $root = 'release/win-unpacked'
          $electronVersion = (Get-Content 'node_modules/electron/package.json' -Raw | ConvertFrom-Json).version
          $manifest = @(
            'Agent Creation — Windows x64 development snapshot'
            "Source repository: https://github.com/${{ github.repository }}"
            "Source commit: $sha"
            "Build UTC: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "OS: $([System.Environment]::OSVersion.VersionString)"
            "Python: $(uv run --locked python --version)"
            "Node: $(node --version)"
            "Electron: $electronVersion"
            'Package type: extracted Electron directory with bundled PyInstaller backend'
            'Packaged backend smoke: see BACKEND-SMOKE.json (clean startup, local HTTP/WebSocket, settings and conversation restart).'
            'No Electron GUI launch, real user profile, model inference, audio, avatar or agent integration test performed.'
            'No signing, installer, publishing, auto-updates or release tags.'
          )
          $manifest | Set-Content -Path "$root/BUILD-MANIFEST.txt" -Encoding UTF8
          $name = "Agent-Creation-Windows-x64-dev-$short.zip"
          Compress-Archive -Path "$root/*" -DestinationPath "release/$name" -CompressionLevel Optimal
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Path "release/$name.sha256" -Encoding ASCII
          Write-Host "Inner package SHA-256: $hash"
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "## Windows x64 development package" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $sha" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          "ZIP: $name" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload development package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-dev-${{ github.sha }}
          path: |
            release/${{ steps.archive.outputs.name }}
            release/${{ steps.archive.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 14
